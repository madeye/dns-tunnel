[package]
name = "dns-tunnel"
version = "0.1.0"
edition = "2021"
description = "SIP003 Shadowsocks plugin that obfuscates traffic as DoQ (DNS-over-QUIC, RFC 9250) query/response messages"
license = "MIT"

[[bin]]
name = "dns-tunnel"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = "0.13"
webpki-roots = "0.26"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
