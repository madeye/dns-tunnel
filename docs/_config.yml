title: dns-tunnel
description: SIP003 Shadowsocks plugin that obfuscates traffic as DNS-over-QUIC
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

include:
  - README.md

show_downloads: false

github:
  repository_url: https://github.com/madeye/dns-tunnel
  repository_nwo: madeye/dns-tunnel

defaults:
  - scope:
      path: ""
    values:
      layout: default
